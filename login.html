<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SCAN360</title>
    <link rel="icon" type="image/png" href="assets/img/favicon.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 420px;
            padding: 48px 40px;
        }

        .logo-container {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo-container img {
            max-width: 180px;
            height: auto;
        }

        h1 {
            font-size: 24px;
            font-weight: 600;
            color: #1a1a1a;
            margin-bottom: 8px;
            text-align: center;
        }

        .subtitle {
            color: #6b7280;
            font-size: 14px;
            text-align: center;
            margin-bottom: 32px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #374151;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            font-size: 15px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            transition: all 0.2s;
            font-family: inherit;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .btn-login {
            width: 100%;
            padding: 12px 16px;
            font-size: 15px;
            font-weight: 600;
            color: white;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 24px;
        }

        .btn-login:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .error-message {
            background: #fee;
            color: #c33;
            padding: 12px 16px;
            border-radius: 6px;
            font-size: 14px;
            margin-bottom: 20px;
            display: none;
            border-left: 3px solid #c33;
        }

        .error-message.show {
            display: block;
        }

        .footer {
            margin-top: 32px;
            text-align: center;
            color: #6b7280;
            font-size: 13px;
        }

        .footer a {
            color: #667eea;
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 32px 24px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo-container">
            <img src="assets/img/logo_scan.png" alt="SCAN360 Logo">
        </div>

        <h1>Accedi a SCAN360</h1>
        <p class="subtitle">Analisi economico-finanziaria avanzata</p>

        <div id="errorMessage" class="error-message">
            Credenziali non valide. Riprova.
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="username">Username</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    required
                    autocomplete="username"
                    autofocus
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    required
                    autocomplete="current-password"
                >
            </div>

            <button type="submit" class="btn-login">Accedi</button>
        </form>

        <div class="footer">
            Powered by <a href="http://www.kitzanos.com" target="_blank">Kitzanos Lab</a>
        </div>
    </div>

    <script>
        // Carica le credenziali dal JSON
        let credentials = null;

        fetch('data/company.json')
            .then(response => response.json())
            .then(data => {
                credentials = data.authentication;
            })
            .catch(error => {
                console.error('Errore caricamento credenziali:', error);
            });

        // Gestione form login
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorMessage = document.getElementById('errorMessage');

            if (!credentials) {
                errorMessage.textContent = 'Errore di sistema. Riprova.';
                errorMessage.classList.add('show');
                return;
            }

            if (username === credentials.username && password === credentials.password) {
                // Login riuscito
                sessionStorage.setItem('scan360_authenticated', 'true');
                sessionStorage.setItem('scan360_username', username);
                sessionStorage.setItem('scan360_login_time', new Date().toISOString());

                // Redirect alla dashboard
                window.location.href = 'index.html';
            } else {
                // Login fallito
                errorMessage.textContent = 'Credenziali non valide. Riprova.';
                errorMessage.classList.add('show');

                // Reset password field
                document.getElementById('password').value = '';
                document.getElementById('password').focus();

                // Nascondi errore dopo 3 secondi
                setTimeout(() => {
                    errorMessage.classList.remove('show');
                }, 3000);
            }
        });

        // Controlla se già autenticato
        if (sessionStorage.getItem('scan360_authenticated') === 'true') {
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
